<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Government Queue Management Portal</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React, ReactDOM, and Babel for running React code in-browser -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Simple SVG Icons
        const Icons = {
            Smartphone: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>,
            UserPlus: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>,
            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            Users: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            CheckCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            LayoutDashboard: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>,
            Globe: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>,
            UserCheck: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></svg>,
            AlertCircle: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
            ClipboardList: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>,
            Search: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        };

        // Sub-components moved outside to prevent focus loss
        const CustomerLanding = ({ formData, setFormData, addToQueue }) => (
            <div className="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col">
                <div className="bg-blue-700 p-8 text-white text-center">
                    <div className="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-4">
                        <Icons.Smartphone />
                    </div>
                    <h1 className="text-2xl font-bold">Welcome to Department Portal</h1>
                    <p className="opacity-80 mt-2 text-sm">Join the queue via Wi-Fi to save time.</p>
                </div>

                <form onSubmit={addToQueue} className="p-6 space-y-4 flex-grow">
                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                        <input 
                            required
                            className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                            placeholder="e.g. Jane Doe"
                            value={formData.name}
                            onChange={e => setFormData({...formData, name: e.target.value})}
                        />
                    </div>

                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Citizenship Status</label>
                        <select 
                            className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white"
                            value={formData.citizenship}
                            onChange={e => setFormData({...formData, citizenship: e.target.value})}
                        >
                            <option value="South African">South African</option>
                            <option value="Foreigner">Foreigner</option>
                        </select>
                    </div>

                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Service Required</label>
                        <select 
                            className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white"
                            value={formData.service}
                            onChange={e => setFormData({...formData, service: e.target.value})}
                        >
                            <option value="1. SmartID">1. SmartID</option>
                            <option value="2. Passport">2. Passport</option>
                            <option value="3. Births and Deaths">3. Births and Deaths</option>
                            <option value="4. Refugee Application">4. Refugee Application</option>
                            <option value="5. Other">5. Other</option>
                        </select>
                    </div>

                    <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Reason for Visit (Optional)</label>
                        <textarea 
                            className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none h-20"
                            placeholder="Explain briefly to help us prepare your file..."
                            value={formData.details}
                            onChange={e => setFormData({...formData, details: e.target.value})}
                        />
                    </div>

                    <div className="bg-blue-50 p-4 rounded-lg flex items-start gap-3">
                        <div className="text-blue-600 mt-0.5"><Icons.AlertCircle /></div>
                        <p className="text-xs text-blue-800">
                            By joining the queue, you'll receive a digital ticket. Please stay within the Wi-Fi range to receive updates.
                        </p>
                    </div>

                    <button 
                        type="submit"
                        className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition-all shadow-md flex items-center justify-center gap-2"
                    >
                        <Icons.UserPlus />
                        Get My Digital Ticket
                    </button>
                </form>
            </div>
        );

        const CustomerStatus = ({ queue, currentUser, setCurrentUser, setView, getPosition, getWaitTime }) => {
            const person = queue.find(q => q.id === currentUser?.id);
            const position = getPosition(currentUser?.id);
            const isServing = person?.status === 'serving';
            const isCalling = person?.status === 'calling';

            return (
                <div className="max-w-md mx-auto bg-slate-50 min-h-screen shadow-lg">
                    <div className="bg-blue-700 p-6 text-white text-center rounded-b-3xl">
                        <h2 className="text-lg font-medium opacity-90">Your Ticket Number</h2>
                        <div className="text-5xl font-black my-2">#{currentUser?.id}</div>
                        <p className="text-sm font-bold bg-white/20 py-1 px-4 rounded-full inline-block">
                            {person?.service} ({person?.citizenship})
                        </p>
                    </div>

                    <div className="p-6 -mt-8">
                        <div className="bg-white rounded-2xl shadow-xl p-8 text-center border border-gray-100">
                            {isServing ? (
                                <div className="space-y-4">
                                    <div className="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto">
                                        <Icons.CheckCircle />
                                    </div>
                                    <h3 className="text-2xl font-bold text-gray-800">You are being served!</h3>
                                    <p className="text-gray-500">Please proceed to Counter 4.</p>
                                </div>
                            ) : isCalling ? (
                                <div className="space-y-4 animate-pulse">
                                    <div className="w-20 h-20 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto">
                                        <Icons.Users />
                                    </div>
                                    <h3 className="text-2xl font-bold text-orange-600 uppercase tracking-wider">It's your turn!</h3>
                                    <p className="text-gray-800 font-medium">Please head to the service desk immediately.</p>
                                </div>
                            ) : (
                                <div className="space-y-6">
                                    <div>
                                        <p className="text-gray-500 text-sm uppercase font-semibold">Position in Queue</p>
                                        <p className="text-6xl font-black text-blue-600">{position}</p>
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-slate-50 p-4 rounded-xl">
                                            <div className="text-gray-400 mb-1 flex justify-center"><Icons.Clock /></div>
                                            <p className="text-xs text-gray-400">Est. Wait</p>
                                            <p className="font-bold">{getWaitTime(position)} min</p>
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded-xl">
                                            <div className="text-gray-400 mb-1 flex justify-center"><Icons.Users /></div>
                                            <p className="text-xs text-gray-400">Ahead of you</p>
                                            <p className="font-bold">{position - 1} people</p>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="mt-8 space-y-4">
                            <h4 className="font-bold text-gray-700">Preparation Tips</h4>
                            <div className="bg-white p-4 rounded-xl border border-gray-200 flex items-center gap-4">
                                <div className="w-10 h-10 bg-amber-50 rounded-lg flex items-center justify-center text-amber-600 shrink-0">
                                    <Icons.ClipboardList />
                                </div>
                                <div>
                                    <p className="text-sm font-bold text-gray-800">Have your documents ready</p>
                                    <p className="text-xs text-gray-500">Ensure original and 2 copies are ready.</p>
                                </div>
                            </div>
                            <button 
                                onClick={() => {setCurrentUser(null); setView('landing');}}
                                className="w-full py-3 text-gray-400 text-sm hover:text-red-500 transition-colors"
                            >
                                Cancel my ticket
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const StaffDashboard = ({ queue, setQueue, updateStatus }) => (
            <div className="min-h-screen bg-slate-900 text-white p-8">
                <div className="max-w-6xl mx-auto">
                    <header className="flex justify-between items-center mb-10">
                        <div>
                            <h1 className="text-3xl font-black tracking-tight flex items-center gap-3">
                                <span className="text-blue-500"><Icons.LayoutDashboard /></span>
                                Service Center Dashboard
                            </h1>
                            <p className="text-slate-400 mt-1">Real-time queue management system</p>
                        </div>
                        <div className="flex gap-4">
                            <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                                <p className="text-xs text-slate-500 uppercase font-bold">Waiting</p>
                                <p className="text-2xl font-black">{queue.filter(q => q.status === 'waiting').length}</p>
                            </div>
                            <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700">
                                <p className="text-xs text-slate-500 uppercase font-bold">Avg Wait Time</p>
                                <p className="text-2xl font-black">14m</p>
                            </div>
                        </div>
                    </header>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div className="lg:col-span-2 space-y-4">
                            <div className="flex items-center justify-between mb-2 px-2">
                                <h2 className="font-bold text-xl">Active Queue</h2>
                                <div className="flex items-center gap-2 bg-slate-800 rounded-lg px-3 py-1.5 text-sm">
                                    <Icons.Search />
                                    <input className="bg-transparent outline-none text-slate-300 w-32" placeholder="Search..." />
                                </div>
                            </div>

                            <div className="bg-slate-800/50 rounded-3xl border border-slate-700/50 overflow-hidden">
                                <table className="w-full text-left">
                                    <thead className="bg-slate-800 text-slate-400 text-xs uppercase font-bold">
                                        <tr>
                                            <th className="px-6 py-4 text-center">Identity</th>
                                            <th className="px-6 py-4">Customer</th>
                                            <th className="px-6 py-4 text-center">Ticket</th>
                                            <th className="px-6 py-4">Service</th>
                                            <th className="px-6 py-4 text-right">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-700/50">
                                        {queue.map((person) => (
                                            <tr key={person.id} className={`${person.status === 'calling' ? 'bg-blue-500/10' : ''} hover:bg-white/5 transition-colors`}>
                                                <td className="px-6 py-4 text-center">
                                                    <div className="flex flex-col items-center">
                                                        {person.citizenship === 'South African' ? (
                                                            <div className="text-green-500"><Icons.UserCheck /></div>
                                                        ) : (
                                                            <div className="text-indigo-400"><Icons.Globe /></div>
                                                        )}
                                                        <span className="text-[10px] uppercase font-bold tracking-tighter opacity-70">
                                                            {person.citizenship}
                                                        </span>
                                                    </div>
                                                </td>
                                                <td className="px-6 py-4">
                                                    <div className="font-bold">{person.name}</div>
                                                    <div className="text-xs text-slate-500 truncate max-w-[150px] italic">"{person.details || 'No additional info'}"</div>
                                                </td>
                                                <td className="px-6 py-4 text-center font-mono font-bold text-blue-400">#{person.id}</td>
                                                <td className="px-6 py-4">
                                                    <span className="bg-slate-700 px-3 py-1 rounded-full text-xs font-medium uppercase tracking-wider">
                                                        {person.service.split('. ')[1]}
                                                    </span>
                                                </td>
                                                <td className="px-6 py-4 text-right">
                                                    {person.status === 'waiting' && (
                                                        <button 
                                                            onClick={() => updateStatus(person.id, 'calling')}
                                                            className="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2 px-4 rounded-lg"
                                                        >
                                                            Call
                                                        </button>
                                                    )}
                                                    {person.status === 'calling' && (
                                                        <button 
                                                            onClick={() => updateStatus(person.id, 'serving')}
                                                            className="bg-green-600 hover:bg-green-500 text-white text-xs font-bold py-2 px-4 rounded-lg"
                                                        >
                                                            Start
                                                        </button>
                                                    )}
                                                    {person.status === 'serving' && (
                                                        <button 
                                                            onClick={() => setQueue(prev => prev.filter(p => p.id !== person.id))}
                                                            className="bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white text-xs font-bold py-2 px-4 rounded-lg transition-all"
                                                        >
                                                            End
                                                        </button>
                                                    )}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div className="space-y-6">
                            <h2 className="font-bold text-xl">Operational Insights</h2>
                            <div className="bg-gradient-to-br from-blue-600 to-indigo-700 p-6 rounded-3xl shadow-xl">
                                <h3 className="font-bold text-lg mb-4">Live Statistics</h3>
                                <div className="space-y-3">
                                    <div className="bg-white/10 p-3 rounded-xl flex items-center justify-between">
                                        <span className="text-sm">South Africans</span>
                                        <span className="font-bold">{queue.filter(q => q.citizenship === 'South African').length}</span>
                                    </div>
                                    <div className="bg-white/10 p-3 rounded-xl flex items-center justify-between">
                                        <span className="text-sm">Foreigners</span>
                                        <span className="font-bold">{queue.filter(q => q.citizenship === 'Foreigner').length}</span>
                                    </div>
                                </div>
                            </div>
                            <div className="bg-slate-800 p-6 rounded-3xl border border-slate-700">
                                <h3 className="font-bold mb-4">Pre-Screening Info</h3>
                                {queue.find(q => q.status === 'calling' || q.status === 'serving') ? (
                                    <div className="p-3 bg-slate-900 rounded-xl">
                                        <p className="text-xs text-slate-500 uppercase">Current Client</p>
                                        <p className="font-bold">{queue.find(q => q.status === 'calling' || q.status === 'serving').name}</p>
                                        <p className="text-sm text-blue-400 mt-2">Notes:</p>
                                        <p className="text-sm text-slate-300 italic">
                                            {queue.find(q => q.status === 'calling' || q.status === 'serving').details || "No notes."}
                                        </p>
                                    </div>
                                ) : (
                                    <p className="text-sm text-slate-500 italic">No active customer.</p>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const [view, setView] = useState('landing');
            const [queue, setQueue] = useState([
                { id: '101', name: 'John Doe', citizenship: 'South African', service: '1. SmartID', details: 'Lost original document', status: 'waiting', timestamp: Date.now() - 1200000 },
                { id: '102', name: 'Sarah Smith', citizenship: 'Foreigner', service: '2. Passport', details: 'Urgent travel next week', status: 'waiting', timestamp: Date.now() - 600000 },
                { id: '103', name: 'Michael Chen', citizenship: 'South African', service: '3. Births and Deaths', details: 'Newborn registration', status: 'serving', timestamp: Date.now() - 300000 },
            ]);
            const [currentUser, setCurrentUser] = useState(null);
            const [formData, setFormData] = useState({ 
                name: '', 
                citizenship: 'South African', 
                service: '1. SmartID', 
                details: '' 
            });

            const addToQueue = (e) => {
                e.preventDefault();
                const newUser = {
                    id: Math.floor(100 + Math.random() * 900).toString(),
                    ...formData,
                    status: 'waiting',
                    timestamp: Date.now()
                };
                setQueue([...queue, newUser]);
                setCurrentUser(newUser);
                setView('customer-status');
            };

            const updateStatus = (id, newStatus) => {
                setQueue(prev => prev.map(item => item.id === id ? { ...item, status: newStatus } : item));
            };

            const getPosition = (id) => {
                const waitingList = queue.filter(q => q.status === 'waiting' || q.status === 'calling');
                return waitingList.findIndex(q => q.id === id) + 1;
            };

            const getWaitTime = (position) => position * 12;

            return (
                <div>
                    {view === 'landing' && (
                        <CustomerLanding 
                            formData={formData} 
                            setFormData={setFormData} 
                            addToQueue={addToQueue} 
                        />
                    )}
                    {view === 'customer-status' && (
                        <CustomerStatus 
                            queue={queue} 
                            currentUser={currentUser} 
                            setCurrentUser={setCurrentUser} 
                            setView={setView} 
                            getPosition={getPosition} 
                            getWaitTime={getWaitTime} 
                        />
                    )}
                    {view === 'staff-dashboard' && (
                        <StaffDashboard 
                            queue={queue} 
                            setQueue={setQueue} 
                            updateStatus={updateStatus} 
                        />
                    )}

                    {/* Simulation Switcher */}
                    <div className="fixed bottom-4 left-4 z-50 flex gap-2 bg-white/90 backdrop-blur p-2 rounded-2xl shadow-xl border border-gray-200">
                        <button onClick={() => setView('landing')} className={`px-4 py-2 rounded-xl text-xs font-bold ${view === 'landing' ? 'bg-blue-600 text-white' : 'hover:bg-gray-100'}`}>Customer View</button>
                        <button onClick={() => setView('staff-dashboard')} className={`px-4 py-2 rounded-xl text-xs font-bold ${view === 'staff-dashboard' ? 'bg-slate-900 text-white' : 'hover:bg-gray-100'}`}>Staff Dashboard</button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
